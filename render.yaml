services:
  - type: web
    name: finance-gaming-backend
    runtime: docker
    rootDir: FinancialGamingBackend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CORS_ALLOWED_ORIGINS
        sync: false
