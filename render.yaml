services:
  - type: web
    name: finance-gaming-backend
    runtime: java
    rootDir: FinancialGamingBackend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/finance-gaming-backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CORS_ALLOWED_ORIGINS
        sync: false
