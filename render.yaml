services:
  - type: web
    name: finance-gaming-backend
    runtime: docker
    dockerfilePath: FinancialGamingBackend/Dockerfile
    dockerContext: FinancialGamingBackend
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CORS_ALLOWED_ORIGINS
        sync: false
